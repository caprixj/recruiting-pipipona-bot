[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .

# Chronological ordering for better file sorting
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Force UTC to prevent team timezone conflicts
timezone = UTC
truncate_slug_length = 40
path_separator = os

[post_write_hooks]
# Auto-format migrations to pass CI/CD
hooks = ruff, black

# 1. Ruff: Fix imports (isort) and linting errors
ruff.type = exec
ruff.executable = poetry
ruff.options = run ruff check --fix --select I,F,E,W REVISION_SCRIPT_FILENAME

# 2. Black: Format code to 120 chars
black.type = exec
black.executable = poetry
black.options = run black -l 120 REVISION_SCRIPT_FILENAME

# Logging configuration. This is also consumed by the user-maintained
# env.py script only.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S