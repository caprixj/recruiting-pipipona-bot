surveys:
  adizes_v1:
    title: "Тест управленческого стиля (PAEI)"

    q1: "При принятии сложного решения я обычно:"
    q1_opt:
      A: "Действую быстро, чтобы не терять время"
      B: "Анализирую все детали и риски"
      C: "Ищу новые, нестандартные подходы"
      D: "Советуюсь с командой, чтобы все были согласны"

    q2: "Если в работе возникает конфликт, я:"
    q2_opt:
      A: "Стараюсь победить и настоять на своем"
      B: "Обращаюсь к правилам и инструкциям"
      C: "Предлагаю творческий компромисс"
      D: "Стараюсь сгладить углы и сохранить отношения"

    q3: "Мой стиль планирования:"
    q3_opt:
      A: "Краткосрочный, ориентированный на результат здесь и сейчас"
      B: "Детальный, последовательный и структурированный"
      C: "Глобальный, вижу общую картину и перспективы"
      D: "Ориентированный на людей, кто и что будет делать"