bot:
  name: "BP Lab Talent"
  description: |
    BP Lab Talent - бот для онлайн-тестирования кандидатов.
    Используется для оценки профессиональных и управленческих особенностей в рамках подбора персонала.

onboarding:
  welcome_empty: |
    В рамках рассмотрения вашей кандидатуры на одну из вакансий партнёра BP Lab вам предложено пройти онлайн-тестирование.
    Пожалуйста, отвечайте самостоятельно и опирайтесь на реальное поведение.
    Результаты носят ознакомительный характер.

  start_msg: |
    👋 Здравствуйте!
    
    Вы рассматриваетесь на одну из вакансий партнёра BP Lab и приглашены пройти онлайн-тестирование.
    
    Пожалуйста, отвечайте самостоятельно и опирайтесь на ваше реальное поведение и решения.
    
    ⏱️ Прохождение займёт около 10–15 минут.
    ℹ️ Результаты носят ознакомительный характер и не являются профессиональной диагностикой.
    
    Когда будете готовы — нажмите «Начать!».

  welcome_back: |
    👋 С возвращением!
    
    Вы уже прошли регистрацию. Чтобы начать или продолжить тест, используйте ссылку из вашего приглашения или нажмите кнопку ниже.

  ask_name: "Пожалуйста, укажите ваши ФИО (как в резюме)."
  ask_phone: "Укажите номер телефона"
  ask_cv: "Укажите ссылку на резюме"
  button:
    phone: "📱 Поделиться телефоном"
    start: "Начать!"
    start_test: "▶️ Начать тест"
  success: |
    ℹ️ <b>Профиль обновлён!</b>
    
    Вы готовы к прохождению теста.
    Нажмите кнопку ниже, чтобы начать.

  profile_updated_resume: |
    ℹ️ <b>Профиль обновлён!</b>
    
    Я вижу, что у вас есть тест, ожидающий подтверждения. Давайте вернёмся к нему.

  error:
    wrong_contact: "Пожалуйста, поделитесь своим собственным номером телефона."
    phone_invalid: "Неправильный номер. Попробуйте ещё раз."
    cv_invalid: "Пожалуйста, отправьте корректную ссылку на резюме (http/https)."

help:
  main: |
    ℹ️ Помощь
    
    Вы проходите онлайн-тестирование в рамках рассмотрения вашей кандидатуры на вакансию партнёра BP Lab.
    
    Как работает бот:
    • Тест состоит из рабочих ситуаций с вариантами ответов
    • Отвечайте самостоятельно, опираясь на реальное поведение
    • Прохождение занимает около 10–15 минут
    
    Важно:
    • В каждом вопросе необходимо использовать все варианты ответов
    • Результаты носят ознакомительный характер и не являются профессиональной диагностикой
    
    Команды:
    • /start — начать или продолжить тест
    • /help — открыть эту справку
    
    Если возникли сложности — просто продолжайте тест с команды /start."

testing:
  # Messages
  question_header: "Вопрос {n}"
  session_active: |
    ⚠️ <b>У вас есть незавершенный тест.</b>
    
    Хотите продолжить с того места, где остановились, или начать заново?

  session_conflict: |
    🔄 <b>Смена тестирования</b>
    
    Вы перешли по ссылке на новый тест, но у вас есть активная незавершенная сессия. Что вы хотите сделать?

  finished: |
    🏁 <b>Тест завершен!</b>
    
    Спасибо за уделенное время. Ваши ответы сохранены.

  no_active_session: |
    ❌ <b>Активная сессия не найдена.</b>
    
    Пожалуйста, используйте ссылку, предоставленную в вашем приглашении, чтобы начать тест.

  no_survey_key: |
    ❌ <b>Ключ теста не указан.</b>
    
    Пожалуйста, используйте ссылку из приглашения.

  session_expired: |
    ⌛ <b>Сессия истекла или не найдена.</b>
    
    Пожалуйста, используйте /start, чтобы обновить состояние или начать заново.

  completion_summary: |
    <b>🏁 Тестирование завершено!</b>

    Пожалуйста, подтвердите ваши контактные данные перед отправкой:

    👤 <b>Имя:</b> {full_name}
    📱 <b>Телефон:</b> {phone}
    📄 <b>CV:</b> {cv_link}

    <i>Нажимая кнопку ниже, вы подтверждаете актуальность этих данных.</i>

    💡 <i>Если данные неверны, вы можете изменить их в любое время командой /onboard</i>

  # Errors
  error_format: "⚠️ Пожалуйста, распределите все 4 варианта ответов."
  session_no_longer_active: "⚠️ Эта сессия больше не активна."
  error_session_conflict: "⚠️ У вас уже есть активный тест. Пожалуйста, завершите или отмените его."
  error_old_message: "⚠️ Это сообщение устарело. Пожалуйста, используйте последнее сообщение внизу чата."

  # Prompts (Polymorphic)
  prompt_ranking: "Нажимайте по очереди в порядке приоритетности от <b>наиболее</b> (1-е место) к <b>наименее</b> (4-е место) характерному для вас варианта."
  prompt_single_choice: "Выберите один вариант, который лучше всего описывает ситуацию."

  # Buttons
  btn_next: "➡️ Далее"
  btn_reset: "🔄 Сброс"
  btn_continue: "⏯️ Продолжить"
  btn_start_new: "🆕 Начать заново"
  
  # Default values
  not_specified: "Не указано"

profile:
  completed: |
    ✅ <b>Тестирование успешно завершено!</b>
    
    Спасибо за уделенное время. Ваши ответы сохранены и переданы.
  no_active_test: "Нет активного теста для подтверждения."
  profile_not_found: "Профиль не найден. Пожалуйста, сначала завершите регистрацию."
  error_value: "Ошибка: {error}"
  error_generic: "Произошла ошибка: {error}"